services:
  - type: web
    name: delivery-tracker
    runtime: node
    plan: free
    rootDir: .
    buildCommand: >
      npm install --include=dev --prefix server &&
      npm install --include=dev --prefix web &&
      npm run build --prefix web &&
      rm -rf server/web-dist &&
      cp -r web/dist server/web-dist &&
      npm run build --prefix server &&
      npx --prefix server prisma migrate deploy &&
      npx --prefix server prisma db seed
    startCommand: npm run start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: delivery-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: "*"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

databases:
  - name: delivery-tracker-db
    plan: free
